<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ImageMasker tests</title>
<style>
  body { margin: 12px; font: 13px Arial, sans-serif; background: #f0ece4; color: #333; }
  h1 { font-size: 16px; }
  li { padding: 2px 0; }
  .pass { color: #276b2e; }
  .fail { color: #b00020; white-space: pre-wrap; font-family: monospace; }
  #summary { font-weight: 700; }
</style>
</head>
<body>
<h1>Core logic tests</h1>
<p>Document model, undo history, geometry, collage cuts and stroke shapes. No WebGL needed. Results are also in
<code>window.__tests</code> (<code>{ passed, failed, failures }</code>).</p>
<p id="summary">Running…</p>
<ul id="results"></ul>
<script type="module">
import { apply, invert, layerMatrix, multiply, pointInPolygon } from '../src/core/geometry.js';
import {
  cloneLayer,
  createDoc,
  drawingLayer,
  effectLayer,
  emojiLayer,
  findLayer,
  imageLayer,
  insertLayer,
  insertMask,
  maskLayer,
  moveLayer,
  rebaseDoc,
  rectLayer,
  removeLayers,
  resizeCanvas,
  updateLayer,
  usedEmojis,
} from '../src/core/model.js';
import { Store } from '../src/core/Store.js';
import { area, COLLAGE_PRESETS, cutPieces, insetPiece, randomCuts } from '../src/collage/layout.js';
import { normalizeDoc } from '../src/app/sessions.js';
import { EMOJI_VOCAB, SERVER_EMOJIS, splitEmojis } from '../src/masks/emojiData.js';
import { normalizeRepeat } from '../src/raster/repeat.js';
import { emojiArtUrl, twemojiCode } from '../src/raster/emojiArt.js';
import { smoothedPath, STAMP_SPACING, strokeGeometry } from '../src/raster/strokes.js';
import { restoreToolState } from '../src/app/toolState.js';
import { Compositor } from '../src/gl/Compositor.js';

const tests = [];
const test = (name, run) => tests.push({ name, run });
const near = (a, b, eps = 1e-6) => Math.abs(a - b) <= eps;

function assert(condition, message = 'assertion failed') {
  if (!condition) {
    throw new Error(message);
  }
}

function equal(actual, expected, message = '') {
  if (JSON.stringify(actual) !== JSON.stringify(expected)) {
    throw new Error(`${message}\n  expected ${JSON.stringify(expected)}\n  got      ${JSON.stringify(actual)}`.trim());
  }
}

const asset = (width, height) => ({ id: `asset-${width}x${height}`, width, height });

function pictureDoc(width = 400, height = 300) {
  const doc = createDoc(width, height);

  doc.layers.push(imageLayer(doc, asset(width, height), { name: 'Base image', base: true }));
  return doc;
}

// ── document model ──────────────────────────────────────────────────────────

test('edits return new documents and leave the old one alone', () => {
  const doc = pictureDoc();
  const rect = rectLayer(doc);
  const added = insertLayer(doc, rect);
  const moved = updateLayer(added, rect.id, { x: 10 });

  equal(doc.layers.length, 1, 'original doc changed');
  equal(added.layers.length, 2);
  assert(findLayer(added, rect.id).x !== 10, 'updateLayer mutated the previous doc');
  equal(findLayer(moved, rect.id).x, 10);
  assert(moved.layers[0] === added.layers[0], 'untouched layers should be shared');
});

test('updateLayer with an unknown id returns the same document', () => {
  const doc = pictureDoc();

  assert(updateLayer(doc, 'nope', { x: 1 }) === doc);
});

test('updateLayer accepts a function patch', () => {
  const doc = insertLayer(pictureDoc(), rectLayer(pictureDoc()));
  const id = doc.layers[1].id;

  equal(findLayer(updateLayer(doc, id, (layer) => ({ opacity: layer.opacity / 2 })), id).opacity, 0.5);
});

test('insertMask keeps "reveal original" layers on top', () => {
  let doc = pictureDoc();
  const reveal = effectLayer(doc, 'original', { coverage: 'paint' });
  const blur = effectLayer(doc, 'blur');

  doc = insertMask(doc, reveal);
  doc = insertMask(doc, blur);
  equal(doc.layers.map((layer) => layer.effectId ?? 'base'), ['base', 'blur', 'original']);
});

test('removeLayers and moveLayer', () => {
  let doc = pictureDoc();
  const a = rectLayer(doc);
  const b = rectLayer(doc);

  doc = insertLayer(insertLayer(doc, a), b);
  equal(moveLayer(doc, b.id, 1).layers.map((layer) => layer.id).slice(1), [b.id, a.id]);
  equal(moveLayer(doc, 'nope', 0), doc);
  equal(removeLayers(doc, [a.id]).layers.map((layer) => layer.id).slice(1), [b.id]);
});

test('cloneLayer gets a new id, is never the base and names itself once', () => {
  const base = pictureDoc().layers[0];
  const copy = cloneLayer(base, 5);

  assert(copy.id !== base.id);
  equal([copy.base, copy.locked, copy.x - base.x, copy.name], [false, false, 5, 'Base image copy']);
  equal(cloneLayer(copy).name, 'Base image copy');
});

test('resizeCanvas shifts layers and collage areas', () => {
  let doc = pictureDoc(400, 300);
  const rect = { ...rectLayer(doc), x: 100, y: 100, clip: { piece: 0, points: [0, 0, 200, 0, 200, 300] } };

  doc = insertLayer(doc, rect);
  doc = updateLayer(doc, doc.layers[0].id, { cells: [{ points: [0, 0, 200, 0, 200, 300, 0, 300] }] });

  const next = resizeCanvas(doc, { x: 50, y: 20, width: 300, height: 200 });
  const moved = findLayer(next, rect.id);

  equal([next.width, next.height], [300, 200]);
  equal([moved.x, moved.y], [50, 80]);
  equal(moved.clip.points, [-50, -20, 150, -20, 150, 280]);
  equal(next.layers[0].cells[0].points.slice(0, 2), [-50, -20]);
});

test('rebaseDoc fits full-picture effects to the new picture and drops drawings', () => {
  let doc = pictureDoc(400, 300);

  doc = insertMask(doc, effectLayer(doc, 'blur'));
  doc = insertLayer(doc, { ...rectLayer(doc), type: 'drawing', strokes: [] });

  const next = rebaseDoc(doc, asset(800, 600));

  equal([next.width, next.height], [800, 600]);
  equal(next.layers.map((layer) => layer.type), ['image', 'effect']);
  equal([next.layers[1].w, next.layers[1].h, next.layers[1].x, next.layers[1].y], [800, 600, 400, 300]);
});

test('a layer\'s erased area moves with a crop and is dropped with a new picture', () => {
  const stroke = { tool: 'brush', type: 'smooth', color: '#ffffff', size: 20, opacity: 1, seed: 0.5, points: [100, 100, 150, 120] };
  let doc = pictureDoc(400, 300);
  const mask = { ...effectLayer(doc, 'blur'), erased: [stroke] };

  doc = insertMask(doc, mask);

  const cropped = resizeCanvas(doc, { x: 50, y: 20, width: 300, height: 200 });

  equal(findLayer(cropped, mask.id).erased[0].points, [50, 80, 100, 100]);
  equal(rebaseDoc(doc, asset(800, 600)).layers[1].erased, null);
});

test('typed text is split into whole emojis', () => {
  equal(splitEmojis('hello 🐙 and 🦀! 👩‍🚀 🇬🇧 ❤️ 🐙'), ['🐙', '🦀', '👩‍🚀', '🇬🇧', '❤️']);
  equal(splitEmojis('no emojis here 123'), []);
});

test('emoji masks survive a session round trip and a new picture', () => {
  let doc = pictureDoc(400, 300);
  const mask = emojiLayer(doc, ['🐶', '🐱']);

  doc = insertMask(doc, mask);

  const restored = normalizeDoc(JSON.parse(JSON.stringify(doc)), () => true).doc.layers[1];

  equal([restored.source, restored.emojis, restored.params.density], ['emoji', ['🐶', '🐱'], 9]);
  equal(rebaseDoc(doc, asset(800, 600)).layers[1].w, 800);
});

test('repeated image masks keep a valid setting through a session', () => {
  const doc = pictureDoc(400, 300);
  const plain = maskLayer(doc, asset(200, 100));
  const repeated = maskLayer(doc, asset(200, 100), { repeat: { rows: 99, size: 'x' } });

  equal(plain.repeat, null);
  equal(repeated.repeat, { rows: 40, size: 80, stagger: 50, wobble: 0, warp: 0, seed: 0.5 });

  const restored = normalizeDoc(JSON.parse(JSON.stringify(insertMask(doc, repeated))), () => true).doc.layers[1];

  equal(restored.repeat, { rows: 40, size: 80, stagger: 50, wobble: 0, warp: 0, seed: 0.5 });
  equal(normalizeRepeat({ wobble: 250, warp: -3, size: 1000 }), { rows: 12, size: 300, stagger: 50, wobble: 100, warp: 0, seed: 0.5 });
});

test('every palette emoji is listed once, with a theme', () => {
  equal(new Set(EMOJI_VOCAB.map((entry) => entry.emoji)).size, EMOJI_VOCAB.length);
  assert(EMOJI_VOCAB.every((entry) => typeof entry.theme === 'string' && entry.theme), 'an emoji has no theme');
  // Every theme has something that is not just a part to pick first.
  for (const theme of new Set(EMOJI_VOCAB.map((entry) => entry.theme))) {
    assert(EMOJI_VOCAB.some((entry) => entry.theme === theme && !entry.part), `${theme} only has parts`);
  }
});

test('emoji masks and stamps: Twemoji names, used emojis, stamps restored', () => {
  equal(twemojiCode('🐦'), '1f426');
  equal(twemojiCode('❤️'), '2764');
  equal(twemojiCode('🐦‍⬛'), '1f426-200d-2b1b');
  equal(twemojiCode('👩‍⚕️'), '1f469-200d-2695-fe0f');
  assert(emojiArtUrl('❤️', 2).endsWith('/emoji_u2764.svg'), 'blob name of ❤️');
  assert(emojiArtUrl('👩‍⚕️', 2).endsWith('/emoji_u1f469_200d_2695.svg'), 'blob name of a ZWJ sequence');
  assert(emojiArtUrl('©️', 2).endsWith('/emoji_u00a9.svg'), 'blob names pad to 4 digits');

  const doc = pictureDoc();
  const stamp = { tool: 'stamp', emoji: '🦜', size: 30, opacity: 1, angle: 0, spin: 0, style: 0, seed: 0.3, points: [10, 10] };
  const drawing = { ...drawingLayer(doc), strokes: [stamp, { ...stamp, emoji: '🍕', style: 1 }] };
  const emoji = emojiLayer(doc, ['🐶', '🐱']);
  const system = { ...emojiLayer(doc, ['🚗']), params: { ...emoji.params, style: 1 } };
  const full = insertLayer(insertLayer(insertLayer(doc, drawing), emoji), system);

  equal(usedEmojis(full).map(([emoji]) => emoji).sort(), ['🐱', '🐶', '🦜'].sort());

  // Server emojis are `:name:`, always drawn from their picture, even in the device style.
  const server = SERVER_EMOJIS[0];

  if (server) {
    equal(splitEmojis(`a ${server} :not_a_server_emoji: 🐦 ${server}`), [server, '🐦']);
    assert(emojiArtUrl(server, 1).includes('/images/discord-emojis/'), 'server emoji URL');
    equal(usedEmojis(insertLayer(doc, { ...system, emojis: [server, '🚗'] })), [[server, 1]]);
  }
  equal(emoji.params.style, 0);

  const restored = normalizeDoc(JSON.parse(JSON.stringify(full)), () => true).doc;

  equal(restored.layers[1].strokes[0].emoji, '🦜');
});

test('stamp tool options are restored and checked', () => {
  const state = restoreToolState({ stamp: { emoji: 'not an emoji', size: 900, drag: 'nope', recent: ['🐦', 'x', 3], style: 1 } });

  equal(state.stamp.emoji, '😀');
  equal(state.stamp.size, 200);
  equal(state.stamp.drag, 'trail');
  equal(state.stamp.recent, ['🐦']);
  equal(state.stamp.style, 1);
});

test('"only on the layer below" is kept and clips to the nearest unclipped layer', () => {
  const doc = pictureDoc();
  const rect = rectLayer(doc);
  const first = { ...rectLayer(doc), clipBelow: true };
  const second = { ...rectLayer(doc), clipBelow: true };
  const full = insertLayer(insertLayer(insertLayer(doc, rect), first), second);
  const restored = normalizeDoc(JSON.parse(JSON.stringify(full)), () => true).doc;

  equal(restored.layers.map((layer) => layer.clipBelow), [false, false, true, true]);

  const compositor = Object.create(Compositor.prototype);

  equal(compositor.clipBase(full.layers, 3).id, rect.id);
  equal(compositor.clipBase(full.layers, 2).id, rect.id);
  equal(compositor.clipBase([{ ...first }], 0), null);
});

// ── undo history ────────────────────────────────────────────────────────────

test('apply, undo and redo', () => {
  const store = new Store();
  const rect = rectLayer(pictureDoc());

  store.reset(pictureDoc());
  store.apply('Add', (doc) => insertLayer(doc, rect));
  equal(store.doc.layers.length, 2);
  store.undo();
  equal(store.doc.layers.length, 1);
  store.redo();
  equal(store.doc.layers.length, 2);
});

test('a gesture (begin/set/end) is one undo step', () => {
  const store = new Store();

  store.reset(insertLayer(pictureDoc(), rectLayer(pictureDoc())));

  const id = store.doc.layers[1].id;

  store.begin();
  for (let x = 1; x <= 5; x += 1) {
    store.set(updateLayer(store.doc, id, { x }));
  }
  store.end('Drag');
  equal(store.undoStack.length, 1);
  store.undo();
  assert(findLayer(store.doc, id).x !== 5);
});

test('a gesture that changes nothing adds no history', () => {
  const store = new Store();

  store.reset(pictureDoc());
  store.begin();
  store.end('Nothing');
  equal(store.undoStack.length, 0);
});

test('a new edit clears redo, and undo restores the selection', () => {
  const store = new Store();
  const a = rectLayer(pictureDoc());

  store.reset(pictureDoc());
  store.apply('Add', (doc) => insertLayer(doc, a));
  store.select([a.id]);
  store.apply('Move', (doc) => updateLayer(doc, a.id, { x: 3 }));
  store.undo();
  equal(store.selection, [a.id]);
  store.apply('Move again', (doc) => updateLayer(doc, a.id, { x: 4 }));
  equal(store.redoStack.length, 0);
});

test('history is capped', () => {
  const store = new Store();

  store.reset(insertLayer(pictureDoc(), rectLayer(pictureDoc())));

  const id = store.doc.layers[1].id;

  for (let x = 0; x < 300; x += 1) {
    store.apply('Move', (doc) => updateLayer(doc, id, { x }));
  }

  assert(store.undoStack.length < 300, `undo stack has ${store.undoStack.length} entries`);
});

// ── geometry ────────────────────────────────────────────────────────────────

test('invert undoes a layer matrix', () => {
  const layer = { x: 120, y: 80, w: 60, h: 40, rotation: 0.4, skewX: 0.1, skewY: -0.05 };
  const m = layerMatrix(layer);
  const back = multiply(invert(m), m);

  [1, 0, 0, 1, 0, 0].forEach((value, index) => assert(near(back[index], value, 1e-9), `entry ${index} is ${back[index]}`));

  const p = apply(m, 0.25, -0.3);
  const q = apply(invert(m), p.x, p.y);

  assert(near(q.x, 0.25, 1e-9) && near(q.y, -0.3, 1e-9));
});

test('pointInPolygon', () => {
  const triangle = [0, 0, 10, 0, 0, 10];

  assert(pointInPolygon(2, 2, triangle));
  assert(!pointInPolygon(8, 8, triangle));
  assert(!pointInPolygon(-1, 1, triangle));
});

// ── collage cuts ────────────────────────────────────────────────────────────

test('every preset tiles the whole frame', () => {
  for (const preset of COLLAGE_PRESETS) {
    const pieces = cutPieces(900, 600, preset.cuts);
    const total = pieces.reduce((sum, piece) => sum + Math.abs(area(piece)), 0);

    assert(pieces.length >= 2, `${preset.id}: ${pieces.length} pieces`);
    assert(near(total, 900 * 600, 1), `${preset.id}: pieces cover ${total}`);
  }
});

test('grid of four gives four equal pieces in reading order', () => {
  const pieces = cutPieces(800, 600, COLLAGE_PRESETS.find((preset) => preset.id === 'grid').cuts);

  equal(pieces.length, 4);
  pieces.forEach((piece) => assert(near(Math.abs(area(piece)), 120000, 1)));

  const corners = pieces.map((piece) => [Math.min(...piece.map((p) => p.x)), Math.min(...piece.map((p) => p.y))]);

  equal(corners, [[0, 0], [400, 0], [0, 300], [400, 300]]);
});

test('a short cut only splits the piece it is drawn in', () => {
  const half = { a: { x: 0.5, y: -0.05 }, b: { x: 0.5, y: 1.05 } };
  const short = { a: { x: 0.6, y: 0.5 }, b: { x: 0.9, y: 0.5 } };

  equal(cutPieces(800, 600, [half, short]).length, 3);
});

test('insetPiece leaves gaps and drops pieces that vanish', () => {
  const square = [{ x: 0, y: 0 }, { x: 100, y: 0 }, { x: 100, y: 100 }, { x: 0, y: 100 }];
  const inset = insetPiece(square, 10, 100, 100);

  assert(near(Math.abs(area(inset)), 80 * 80, 1), `area ${Math.abs(area(inset))}`);
  equal(insetPiece(square, 0, 100, 100), square);
  equal(insetPiece(square, 120, 100, 100), null);
});

test('randomCuts gives 3-6 pieces with none tiny', () => {
  for (let run = 0; run < 25; run += 1) {
    const pieces = cutPieces(900, 600, randomCuts(900, 600));
    const smallest = Math.min(...pieces.map((piece) => Math.abs(area(piece))));

    assert(pieces.length >= 2 && pieces.length <= 6, `${pieces.length} pieces`);
    assert(smallest > 900 * 600 * 0.03, `smallest piece ${smallest}`);
  }
});

// ── stroke shapes ───────────────────────────────────────────────────────────

const stroke = (extra) => ({ tool: 'brush', type: 'smooth', color: '#000000', size: 10, opacity: 1, seed: 0.4, ...extra });
const pieceList = (geometry) => Array.from({ length: geometry.pieces.length / 6 }, (_, i) => [...geometry.pieces.subarray(i * 6, i * 6 + 6)]);

test('a smooth stroke is one unbroken path from its first point to its last', () => {
  const points = [0, 0, 100, 0, 100, 100, 200, 100];
  const pieces = pieceList(strokeGeometry(stroke({ points })));

  assert(near(pieces[0][0], 0) && near(pieces[0][1], 0), 'starts at the first point');
  assert(near(pieces.at(-1)[2], 200, 1e-3) && near(pieces.at(-1)[3], 100, 1e-3), 'ends at the last point');
  assert(pieces.every((piece, i) => i === 0 || (near(piece[0], pieces[i - 1][2], 1e-3) && near(piece[1], pieces[i - 1][3], 1e-3))), 'pieces join up');
  assert(pieces.every((piece) => piece[4] === 5 && piece[5] === 0), 'radius is half the size, round ends');
});

test('smoothed curves stay within a fraction of a pixel of the true curve', () => {
  const points = [0, 0, 400, 0, 400, 400];
  const path = smoothedPath(points);
  // The curve runs (0,0) → control (400,0) → midpoint (400,200), then straight on to (400,400).
  for (let t = 0; t <= 1; t += 0.01) {
    const x = 2 * (1 - t) * t * 400 + t * t * 400;
    const y = t * t * 200;
    let best = Infinity;

    for (let i = 2; i < path.length; i += 2) {
      const [ax, ay, bx, by] = [path[i - 2], path[i - 1], path[i], path[i + 1]];
      const u = Math.max(0, Math.min(1, ((x - ax) * (bx - ax) + (y - ay) * (by - ay)) / ((bx - ax) ** 2 + (by - ay) ** 2 || 1)));

      best = Math.min(best, Math.hypot(ax + (bx - ax) * u - x, ay + (by - ay) * u - y));
    }

    assert(best < 0.25, `${best.toFixed(3)} px off at t = ${t.toFixed(2)}`);
  }
});

test('marker strokes have square ends only at the start and the end', () => {
  const pieces = pieceList(strokeGeometry(stroke({ type: 'marker', points: [0, 0, 50, 10, 100, 0, 150, 10] })));

  assert(pieces[0][5] === 1, 'square start');
  assert(pieces.at(-1)[5] === 2, 'square end');
  assert(pieces.slice(1, -1).every((piece) => piece[5] === 0), 'round joins in between');
  assert(near(pieces[0][4], 6.5), 'marker is 1.3 × the size wide');
  assert(pieceList(strokeGeometry(stroke({ type: 'marker', points: [0, 0, 50, 0] })))[0][5] === 3, 'one piece: both ends square');
});

test('dots, spray and stamps are placed the same way every time', () => {
  const dotted = pieceList(strokeGeometry(stroke({ type: 'dotted', points: [0, 0, 170, 0] })));

  assert(dotted.length === 11 && dotted.every((piece, i) => near(piece[0], i * 17, 1e-3) && piece[0] === piece[2]), `${dotted.length} dots, 1.7 × size apart`);

  const spray = (seed) => [...strokeGeometry(stroke({ type: 'spray', seed, points: [0, 0, 30, 0] })).pieces];

  assert(JSON.stringify(spray(0.4)) === JSON.stringify(spray(0.4)), 'same seed, same spray');
  assert(JSON.stringify(spray(0.4)) !== JSON.stringify(spray(0.6)), 'new seed, new spray');

  const stamps = strokeGeometry({ tool: 'stamp', emoji: '😀', size: 40, opacity: 1, angle: 90, spin: 0, seed: 0.2, points: [0, 0, 440, 0] }).stamps;

  assert(stamps.length / 4 === Math.floor(440 / (40 * STAMP_SPACING)) + 1, `${stamps.length / 4} stamps`);
  assert(near(stamps[3], Math.PI / 2, 1e-6) && stamps[2] === 40, 'angle in radians, size kept');
});

test('stroke shapes are cached per stroke and have bounds that cover them', () => {
  const brush = stroke({ size: 20, points: [10, 10, 60, 30] });
  const geometry = strokeGeometry(brush);

  assert(strokeGeometry(brush) === geometry, 'cached');
  assert(geometry.bounds.join() === [0, 0, 70, 40].join(), `bounds ${geometry.bounds}`);
  assert(strokeGeometry(stroke({ points: [5, 5] })).pieces.length === 6, 'a click is one dot');
  assert(strokeGeometry(stroke({ points: [] })).bounds === null, 'no points, nothing to draw');
});

// ── runner ──────────────────────────────────────────────────────────────────

const list = document.getElementById('results');
const failures = [];

for (const { name, run } of tests) {
  const item = document.createElement('li');

  try {
    await run();
    item.className = 'pass';
    item.textContent = `✓ ${name}`;
  } catch (error) {
    failures.push({ name, message: error.message });
    item.className = 'fail';
    item.textContent = `✗ ${name}\n  ${error.message}`;
  }

  list.append(item);
}

const summary = document.getElementById('summary');

summary.textContent = failures.length ? `${failures.length} of ${tests.length} failed` : `All ${tests.length} passed`;
summary.className = failures.length ? 'fail' : 'pass';
window.__tests = { passed: tests.length - failures.length, failed: failures.length, failures };
</script>
</body>
</html>
